<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Letter Garden — Learn the Alphabet!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8FE3FF;
    --sky-bottom:#CFF6FF;
    --grass:#7ED957;
    --grass-dark:#4FAE3B;
    --sun:#FFD23F;
    --bloom:#FF6F9C;
    --grape:#9B6DFF;
    --sky-deep:#3DAEFF;
    --cream:#FFFDF7;
    --ink:#2B2452;
    --ink-soft:#5B547E;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass) 56%, var(--grass-dark) 100%);
    min-height:100vh;
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:40px;
    overflow:hidden;
  }

  /* Sun */
  .sun{
    position:absolute; top:18px; right:22px;
    width:70px; height:70px; border-radius:50%;
    background:var(--sun);
    box-shadow:0 0 0 8px rgba(255,210,63,0.35);
    animation:spin 18s linear infinite;
    z-index:1;
  }
  .sun::before, .sun::after{
    content:""; position:absolute; inset:-16px;
    border-radius:50%;
    background:
      repeating-conic-gradient(var(--sun) 0deg 8deg, transparent 8deg 20deg);
    opacity:0.5;
    z-index:-1;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Clouds */
  .cloud{
    position:absolute; z-index:1; opacity:0.9;
    background:#fff;
    border-radius:50px;
    filter:drop-shadow(0 4px 0 rgba(255,255,255,0.4));
  }
  .cloud::before, .cloud::after{
    content:""; position:absolute; background:#fff; border-radius:50%;
  }
  .cloud1{ width:90px; height:34px; top:60px; left:6%; animation:drift 26s linear infinite; }
  .cloud1::before{ width:50px; height:50px; top:-24px; left:10px; }
  .cloud1::after{ width:38px; height:38px; top:-16px; left:46px; }
  .cloud2{ width:70px; height:26px; top:130px; left:60%; animation:drift 34s linear infinite; animation-delay:-10s; }
  .cloud2::before{ width:36px; height:36px; top:-18px; left:8px; }
  .cloud2::after{ width:28px; height:28px; top:-12px; left:34px; }
  @keyframes drift{
    from{ transform:translateX(-120px); }
    to{ transform:translateX(calc(100vw + 120px)); }
  }

  /* Grass scallops */
  .grass-edge{
    position:absolute; left:0; right:0; top:calc(55% - 1px);
    height:26px; z-index:1;
    background:
      radial-gradient(circle at 10px 0, transparent 12px, var(--grass) 13px) 0 0/24px 26px repeat-x;
  }

  header{
    position:relative; z-index:2;
    width:100%; max-width:720px;
    padding:22px 18px 6px;
    text-align:center;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 7vw, 44px);
    margin:0;
    color:var(--cream);
    text-shadow: 0 3px 0 var(--grape), 0 6px 12px rgba(43,36,82,0.25);
    letter-spacing:0.5px;
  }
  .tagline{
    margin:6px 0 0;
    font-weight:600;
    color:#2B2452;
    background:var(--cream);
    display:inline-block;
    padding:4px 14px;
    border-radius:20px;
    font-size:clamp(13px,3.6vw,15px);
    box-shadow:0 3px 0 rgba(43,36,82,0.15);
  }

  .modebar{
    position:relative; z-index:2;
    display:flex; gap:10px; margin:18px auto 6px;
    background:rgba(255,255,255,0.55);
    padding:6px; border-radius:22px;
    backdrop-filter: blur(2px);
  }
  .modebar button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:15px;
    border:none; border-radius:16px;
    padding:10px 20px; cursor:pointer;
    background:transparent; color:var(--ink);
    transition:transform .15s ease, background .2s ease, color .2s ease;
  }
  .modebar button.active{
    background:var(--bloom); color:#fff;
    box-shadow:0 4px 0 #d6537a;
    transform:translateY(-2px);
  }
  .modebar button:active{ transform:translateY(1px); }

  .statbar{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:8px;
    margin:8px 0 4px;
    font-family:'Baloo 2', sans-serif; font-weight:700;
    color:var(--cream); text-shadow:0 2px 0 rgba(43,36,82,0.3);
    font-size:18px;
  }
  .statbar .star{ font-size:20px; filter:drop-shadow(0 2px 0 rgba(43,36,82,0.25)); }
  .mute-btn{
    margin-left:6px; border:none; background:var(--cream); color:var(--ink);
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:16px;
    box-shadow:0 3px 0 rgba(43,36,82,0.2);
  }

  main{
    position:relative; z-index:2;
    width:100%; max-width:760px;
    padding:14px 16px 10px;
    flex:1;
  }

  /* EXPLORE GRID */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));
    gap:10px;
    margin-top:8px;
  }
  .tile{
    aspect-ratio:1/1;
    border:none; border-radius:16px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:clamp(20px,5.5vw,28px);
    color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 5px 0 rgba(0,0,0,0.15);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tile:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,0.15); }

  /* Card overlay for explore */
  .card-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(43,36,82,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .card-overlay.show{ opacity:1; pointer-events:auto; }
  .letter-card{
    background:var(--cream);
    border-radius:28px;
    padding:26px 30px 22px;
    width:min(340px, 90vw);
    text-align:center;
    box-shadow:0 10px 0 rgba(43,36,82,0.2);
    position:relative;
    transform:scale(0.7) translateY(20px);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .card-overlay.show .letter-card{ transform:scale(1) translateY(0); }
  .letter-card .big-letter{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:78px; line-height:1; margin:0;
  }
  .letter-card .emoji{ font-size:64px; margin:6px 0; display:block; animation:pop .5s ease; }
  @keyframes pop{ 0%{ transform:scale(0);} 70%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
  .letter-card .word{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:22px;
    color:var(--ink); margin:0 0 14px;
  }
  .card-buttons{ display:flex; gap:10px; justify-content:center; }
  .pill-btn{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    border:none; border-radius:18px; padding:10px 16px; cursor:pointer;
    color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .pill-btn.close{ background:var(--ink-soft); }
  .pill-btn.hear{ background:var(--sky-deep); }
  .pill-btn:active{ transform:translateY(3px); box-shadow:none; }

  /* PLAY MODE */
  .play-wrap{ text-align:center; margin-top:6px; }
  .prompt-card{
    background:var(--cream);
    border-radius:26px;
    padding:26px 20px;
    box-shadow:0 8px 0 rgba(43,36,82,0.18);
    max-width:420px; margin:0 auto;
  }
  .prompt-emoji{ font-size:72px; display:block; margin-bottom:8px; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  .prompt-text{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:clamp(17px,4.6vw,22px);
    margin:2px 0 4px;
  }
  .prompt-sub{ font-size:14px; color:var(--ink-soft); margin:0 0 6px; }
  .replay-btn{
    border:none; background:var(--grape); color:#fff;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:8px 16px; border-radius:16px; cursor:pointer;
    box-shadow:0 3px 0 #7448c9; margin-top:4px;
  }
  .replay-btn:active{ transform:translateY(2px); box-shadow:none; }

  .choices{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
    margin-top:22px;
  }
  .choice-btn{
    width:84px; height:84px; border-radius:20px; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:34px;
    color:#fff; cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.15);
    transition:transform .12s ease;
  }
  .choice-btn:active{ transform:translateY(4px); }
  .choice-btn.correct{ animation:correctPulse .5s ease; }
  .choice-btn.wrong{ animation:shake .4s ease; }
  @keyframes correctPulse{ 0%{transform:scale(1);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-8px); }
    75%{ transform:translateX(8px); }
  }

  .feedback{
    margin-top:16px; min-height:28px;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px;
    color:var(--cream); text-shadow:0 2px 0 rgba(43,36,82,0.3);
  }

  .confetti{
    position:fixed; top:-10px; z-index:100;
    width:10px; height:14px; border-radius:2px;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.8; }
  }

  footer{
    position:relative; z-index:2;
    color:var(--cream); font-size:12px; opacity:0.85;
    margin-top:auto; padding-top:14px; text-align:center;
  }

  @media (max-width:420px){
    .choice-btn{ width:72px; height:72px; font-size:28px; }
    .tile{ font-size:20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="grass-edge"></div>

  <header>
    <h1>🌼 Letter Garden</h1>
    <p class="tagline">Tap, listen, and learn your ABCs!</p>
  </header>

  <div class="modebar">
    <button id="exploreBtn" class="active">🔎 Explore</button>
    <button id="playBtn">🎯 Play</button>
  </div>

  <div class="statbar">
    <span class="star">⭐</span><span id="starCount">0</span>
    <button class="mute-btn" id="muteBtn" title="Mute sound">🔊</button>
  </div>

  <main>
    <section id="exploreView">
      <div class="grid" id="grid"></div>
    </section>

    <section id="playView" style="display:none;">
      <div class="play-wrap">
        <div class="prompt-card">
          <span class="prompt-emoji" id="promptEmoji">🍎</span>
          <p class="prompt-text" id="promptText">Which letter is this?</p>
          <p class="prompt-sub">Tap the matching letter</p>
          <button class="replay-btn" id="replayBtn">🔁 Hear again</button>
        </div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </section>
  </main>

  <footer>Made with ❤️ for little learners</footer>
</div>

<div class="card-overlay" id="cardOverlay">
  <div class="letter-card">
    <p class="big-letter" id="cardLetter" style="color:var(--bloom);">A</p>
    <span class="emoji" id="cardEmoji">🍎</span>
    <p class="word" id="cardWord">A is for Apple</p>
    <div class="card-buttons">
      <button class="pill-btn hear" id="cardHear">🔊 Hear it</button>
      <button class="pill-btn close" id="cardClose">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
  const DATA = [
    ["A","Apple","🍎"], ["B","Bear","🐻"], ["C","Cat","🐱"], ["D","Dog","🐶"],
    ["E","Elephant","🐘"], ["F","Fish","🐟"], ["G","Giraffe","🦒"], ["H","Hippo","🦛"],
    ["I","Iguana","🦎"], ["J","Jellyfish","🪼"], ["K","Kite","🪁"], ["L","Lion","🦁"],
    ["M","Monkey","🐵"], ["N","Noodles","🍜"], ["O","Octopus","🐙"], ["P","Penguin","🐧"],
    ["Q","Queen","👸"], ["R","Rabbit","🐰"], ["S","Sun","☀️"], ["T","Tiger","🐯"],
    ["U","Umbrella","☂️"], ["V","Violin","🎻"], ["W","Whale","🐳"], ["X","X-ray","🩻"],
    ["Y","Yo-yo","🪀"], ["Z","Zebra","🦓"]
  ];

  const COLORS = ["#FF6F9C","#9B6DFF","#3DAEFF","#4FAE3B","#FFB23F","#FF8A5C"];

  let stars = 0;
  let muted = false;
  let currentRound = null;

  const grid = document.getElementById('grid');
  const starCount = document.getElementById('starCount');
  const muteBtn = document.getElementById('muteBtn');
  const exploreBtn = document.getElementById('exploreBtn');
  const playBtn = document.getElementById('playBtn');
  const exploreView = document.getElementById('exploreView');
  const playView = document.getElementById('playView');
  const cardOverlay = document.getElementById('cardOverlay');
  const cardLetter = document.getElementById('cardLetter');
  const cardEmoji = document.getElementById('cardEmoji');
  const cardWord = document.getElementById('cardWord');
  const cardHear = document.getElementById('cardHear');
  const cardClose = document.getElementById('cardClose');
  const promptEmoji = document.getElementById('promptEmoji');
  const promptText = document.getElementById('promptText');
  const replayBtn = document.getElementById('replayBtn');
  const choicesWrap = document.getElementById('choices');
  const feedback = document.getElementById('feedback');

  function speak(text){
    if(muted) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not supported, fail silently */ }
  }

  function buildGrid(){
    DATA.forEach((item, i)=>{
      const [letter, word, emoji] = item;
      const btn = document.createElement('button');
      btn.className = 'tile';
      btn.style.background = COLORS[i % COLORS.length];
      btn.textContent = letter;
      btn.addEventListener('click', ()=> openCard(item));
      grid.appendChild(btn);
    });
  }

  function openCard(item){
    const [letter, word, emoji] = item;
    cardLetter.textContent = letter;
    cardEmoji.textContent = emoji;
    cardWord.textContent = `${letter} is for ${word}`;
    cardOverlay.classList.add('show');
    speak(`${letter}. ${letter} is for ${word}.`);
  }
  cardHear.addEventListener('click', ()=>{
    speak(`${cardLetter.textContent}. ${cardWord.textContent}.`);
  });
  cardClose.addEventListener('click', ()=> cardOverlay.classList.remove('show'));
  cardOverlay.addEventListener('click', (e)=>{
    if(e.target === cardOverlay) cardOverlay.classList.remove('show');
  });

  function switchMode(mode){
    if(mode === 'explore'){
      exploreView.style.display = '';
      playView.style.display = 'none';
      exploreBtn.classList.add('active');
      playBtn.classList.remove('active');
    } else {
      exploreView.style.display = 'none';
      playView.style.display = '';
      exploreBtn.classList.remove('active');
      playBtn.classList.add('active');
      nextRound();
    }
  }
  exploreBtn.addEventListener('click', ()=> switchMode('explore'));
  playBtn.addEventListener('click', ()=> switchMode('play'));

  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if(muted){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  });

  function shuffledSample(arr, n, excludeIndex){
    const pool = arr.map((_,i)=>i).filter(i => i !== excludeIndex);
    for(let i = pool.length -1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
    return pool.slice(0,n);
  }

  function nextRound(){
    feedback.textContent = '';
    const targetIndex = Math.floor(Math.random()*DATA.length);
    const [letter, word, emoji] = DATA[targetIndex];
    const distractorIdx = shuffledSample(DATA, 2, targetIndex);
    const options = [targetIndex, ...distractorIdx];
    for(let i = options.length -1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [options[i],options[j]] = [options[j],options[i]];
    }
    currentRound = { targetIndex, options };

    promptEmoji.textContent = emoji;
    promptText.textContent = `Find the letter for ${word}!`;

    choicesWrap.innerHTML = '';
    options.forEach((idx, pos)=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.background = COLORS[pos % COLORS.length];
      btn.textContent = DATA[idx][0];
      btn.addEventListener('click', ()=> handleChoice(btn, idx));
      choicesWrap.appendChild(btn);
    });

    speak(`Find the letter for ${word}.`);
  }

  replayBtn.addEventListener('click', ()=>{
    if(!currentRound) return;
    const word = DATA[currentRound.targetIndex][1];
    speak(`Find the letter for ${word}.`);
  });

  function handleChoice(btn, idx){
    if(!currentRound) return;
    const correct = idx === currentRound.targetIndex;
    if(correct){
      btn.classList.add('correct');
      stars++;
      starCount.textContent = stars;
      feedback.textContent = pickPraise();
      speak('Yes! Great job!');
      launchConfetti();
      Array.from(choicesWrap.children).forEach(c => c.disabled = true);
      setTimeout(nextRound, 1200);
    } else {
      btn.classList.add('wrong');
      feedback.textContent = 'Try again!';
      speak('Try again.');
      setTimeout(()=> btn.classList.remove('wrong'), 400);
    }
  }

  function pickPraise(){
    const praises = ['Great job! ⭐','Wonderful! 🌟','You got it! 🎉','Super! 🌈','Nice work! 🦋'];
    return praises[Math.floor(Math.random()*praises.length)];
  }

  function launchConfetti(){
    const count = 24;
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = Math.random()*100 + 'vw';
      piece.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      piece.style.animationDuration = (1.4 + Math.random()*1.2) + 's';
      piece.style.opacity = 0.9;
      document.body.appendChild(piece);
      setTimeout(()=> piece.remove(), 2800);
    }
  }

  buildGrid();
})();
</script>

</body>
</html>
